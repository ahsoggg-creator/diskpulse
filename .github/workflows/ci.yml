name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --release

  # The runner is an elevated administrator on a real Windows install: the only place where the device layer
  # (enumeration, SMART attempts on a virtual disk, installer) runs for real. Nothing here writes to a disk.
  integration:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: List disks and read S.M.A.R.T. (a virtual disk must report "unavailable", never zeros)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          .\target\release\diskpulse-cli.exe list
          $json = .\target\release\diskpulse-cli.exe list --json | ConvertFrom-Json
          if (-not $json -or $json.Count -lt 1) { throw 'no physical disks found' }
          foreach ($d in $json) {
            $out = .\target\release\diskpulse-cli.exe smart $d.number --json --lang en
            $code = $LASTEXITCODE
            $out
            $r = $out | ConvertFrom-Json
            if ($r.smart.status -eq 'ok') {
              if ($code -ne 0) { throw "disk $($d.number): status ok but exit code $code" }
            } elseif ($r.smart.status -eq 'unavailable') {
              if ($code -ne 2) { throw "disk $($d.number): unavailable but exit code $code" }
              if (-not $r.smart.reason) { throw "disk $($d.number): unavailable without a reason" }
              if ($r.assessment) { throw "disk $($d.number): a verdict was given without data" }
            } else { throw "disk $($d.number): unexpected status $($r.smart.status)" }
          }
      - name: Silent install, registry entry, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item target\release\DiskPulse.exe "$env:RUNNER_TEMP\DiskPulse-Setup.exe"
          & "$env:RUNNER_TEMP\DiskPulse-Setup.exe" --install --silent
          if ($LASTEXITCODE -ne 0) { throw 'install failed' }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\DiskPulse\DiskPulse.exe'
          if (-not (Test-Path $exe)) { throw 'DiskPulse.exe was not installed' }
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\DiskPulse'
          if (-not (Test-Path $key)) { throw 'no Apps & features entry' }
          if ((Get-ItemProperty $key).DisplayVersion -ne (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value) { throw 'wrong version in Apps & features' }
          & $exe --uninstall --silent
          Start-Sleep -Seconds 6
          if (Test-Path $key) { throw 'uninstall left the registry entry' }
          if (Test-Path $exe) { throw 'uninstall left the exe' }
      - name: Background service install, run, remove
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path target\release\DiskPulse.exe).Path
          $p = Start-Process $exe -ArgumentList '--install-service' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "install-service failed: $($p.ExitCode)" }
          Start-Sleep -Seconds 10
          $svc = Get-Service DiskPulseCollector
          if ($svc.Status -ne 'Running') { throw "service is $($svc.Status)" }
          if (-not (Test-Path 'C:\Program Files\DiskPulse\DiskPulse.exe')) { throw 'the service exe is not in Program Files' }
          $log = Get-Content 'C:\ProgramData\DiskPulse\service.log' -Raw
          if ($log -notmatch 'collected') { throw "the service did not collect: $log" }
          $p = Start-Process $exe -ArgumentList '--uninstall-service' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall-service failed: $($p.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Get-Service DiskPulseCollector -ErrorAction SilentlyContinue) { throw 'the service is still registered' }
          if (Test-Path 'C:\Program Files\DiskPulse') { throw 'Program Files copy was not removed' }
      - name: Tray process starts and collects
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Start-Process (Resolve-Path target\release\DiskPulse.exe).Path -ArgumentList '--tray' -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "the tray process exited with $($p.ExitCode)" }
          $log = Get-Content (Join-Path $env:APPDATA 'DiskPulse\logs\diskpulse.log') -Raw
          Stop-Process $p -Force
          if ($log -notmatch 'tray: collected') { throw "the tray did not collect: $log" }
      - name: Read-only surface scan with file attribution (first 200 MB of the C: volume)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $part = Get-Partition -DriveLetter C
          $startGb = [math]::Floor($part.Offset / 4096) * 4096 / 1e9
          $raw = .\target\release\diskpulse-cli.exe scan $part.DiskNumber --start-gb $startGb --len-gb 0.2 --slow-ms 0 --block-mib 1 --json
          if ($LASTEXITCODE -ne 0) { throw "scan exit code $LASTEXITCODE" }
          $r = $raw | ConvertFrom-Json
          if ($r.bytes_read -lt 150e6) { throw "only $($r.bytes_read) bytes were read" }
          if ($r.unreadable.Count -ne 0) { throw 'unreadable blocks on a healthy runner disk' }
          $files = @($r.slow_zones | ForEach-Object { $_.pieces } | ForEach-Object { $_.files } | Where-Object { $_ })
          Write-Host "files attributed to the zone: $($files.Count); first: $(($files | Select-Object -First 5 | ForEach-Object { $_.path }) -join ', ')"
          if ($files.Count -lt 1) { throw 'no file was attributed to any cluster in 200 MB of the C: volume' }
          if (-not ($files | Where-Object { $_.path -like '\*' })) { throw 'attributed paths do not look like paths' }
